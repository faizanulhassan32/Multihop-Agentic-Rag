[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "standalone-reranker-service"
version = "0.1.0"
description = "Standalone BGE CrossEncoder reranking API"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.7,<3",
    "sentence-transformers==3.4.1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["reranker_service*"]
