[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multihop-agentic-rag-backend"
version = "0.1.0"
description = "Backend for Multi‑hop Agentic RAG"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# Dependencies – selected to avoid pydantic and langchain core conflicts
# FastAPI >=0.110 works with Pydantic v2 (required by ollama).
# Uvicorn matches FastAPI version range.
# LangChain >=0.2,<0.3 and LangGraph >=0.2,<0.3 provide compatible LangSmith.
# LangChain‑Ollama 0.1.x works with LangChain 0.2 core.
# Chromadb, Ollama and python‑dotenv remain unchanged.

dependencies = [
    "fastapi>=0.110,<0.111",
    "uvicorn>=0.23,<0.24",
    "langchain>=0.2,<0.3",
    "langgraph>=0.2,<0.3",
    "chromadb==0.4.22",
    "ollama==0.6.3",
    "langchain-ollama>=0.1,<0.2",
    "langchain-chroma==0.1.4",
    "httpx>=0.27,<1",
    "python-dotenv>=0.21",
    "datasets==3.6.0",
    "pyarrow==19.0.1",
]

[tool.setuptools]
packages = ["backend"]
[tool.setuptools.package-dir]
backend = "src"